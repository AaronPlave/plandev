table:
  name: generation
  schema: sequencing
configuration:
  custom_name: "sequence_generation"
object_relationships:
  - name: plan
    using:
      foreign_key_constraint_on: plan_id
  - name: simulation_dataset
    using:
      foreign_key_constraint_on: simulation_dataset_id
array_relationships:
  - name: products
    using:
      foreign_key_constraint_on:
        column: generation_id
        table:
          name: generated_product
          schema: sequencing
# Generations are created and completed only by the sequencing server (generateSequence action).
select_permissions:
  - role: aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
delete_permissions:
  - role: aerie_admin
    permission:
      filter: {}
