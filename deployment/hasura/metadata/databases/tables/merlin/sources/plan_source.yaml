table:
  name: plan_source
  schema: merlin
configuration:
  custom_name: "plan_source"
object_relationships:
- name: plan
  using:
    foreign_key_constraint_on: plan_id
- name: source_revision
  using:
    foreign_key_constraint_on: source_revision_id
select_permissions:
  - role: aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: aerie_admin
    permission:
      columns: [plan_id, source_revision_id, label]
      check: {}
      set:
        created_by: "x-hasura-user-id"
  - role: user
    permission:
      columns: [plan_id, source_revision_id, label]
      check: {"plan":{"owner":{"_eq":"X-Hasura-User-Id"}}}
      set:
        created_by: "x-hasura-user-id"
update_permissions:
  - role: aerie_admin
    permission:
      columns: [label]
      filter: {}
  - role: user
    permission:
      columns: [label]
      filter: {"plan":{"owner":{"_eq":"X-Hasura-User-Id"}}}
# Removing a plan's use of a revision never deletes the revision.
delete_permissions:
  - role: aerie_admin
    permission:
      filter: {}
  - role: user
    permission:
      filter: {"plan":{"owner":{"_eq":"X-Hasura-User-Id"}}}
