# SPIKE: standalone (plan-independent) timeline dataset wrapper.
# No owner column: reads are open like the rest of merlin.dataset; writes are admin-only for the spike.
table:
  name: standalone_dataset
  schema: merlin
configuration:
  custom_name: "standalone_dataset"
object_relationships:
- name: dataset
  using:
    foreign_key_constraint_on: dataset_id
select_permissions:
  - role: aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: aerie_admin
    permission:
      columns: [name, start_time, end_time]
      check: {}
update_permissions:
  - role: aerie_admin
    permission:
      columns: [name, start_time, end_time]
      filter: {}
delete_permissions:
  - role: aerie_admin
    permission:
      filter: {}
